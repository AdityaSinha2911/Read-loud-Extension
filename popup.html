<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Read Aloud</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header>
      <div class="brand-icon" aria-hidden="true">🔊</div>
      <div><h1>Read Aloud</h1><p>Listen to any selected text</p></div>
    </header>

    <button id="readBtn" class="primary">▶ Read selected text</button>

    <section class="playback" aria-label="Playback controls">
      <button id="pauseBtn" class="control">Ⅱ Pause</button>
      <button id="resumeBtn" class="control">▶ Resume</button>
      <button id="stopBtn" class="control stop">■ Stop</button>
    </section>

    <section class="settings">
      <label for="voiceSelect">Voice</label>
      <select id="voiceSelect"><option value="">Loading voices…</option></select>

      <div class="rate-heading"><label for="rateSlider">Reading speed</label><output id="rateValue">1.0×</output></div>
      <input id="rateSlider" type="range" min="0.5" max="2" step="0.1" value="1">
    </section>

    <p id="status" class="status" role="status" aria-live="polite">Select text on a webpage, then press Read.</p>

    <footer>
      <span>Keyboard shortcuts</span>
      <kbd>Alt</kbd> + <kbd>Shift</kbd> + <kbd>R</kbd> Read
      <br><kbd>Alt</kbd> + <kbd>Shift</kbd> + <kbd>P</kbd> Pause / resume
      <br><kbd>Alt</kbd> + <kbd>Shift</kbd> + <kbd>S</kbd> Stop
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
